# xcodegen spec for ACPChat iOS app.
# Запуск: `cd ios && xcodegen generate` → создаст ACPChat.xcodeproj.
# Установка xcodegen: `brew install xcodegen`.

name: ACPChat
options:
  bundleIdPrefix: dev.vrt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""           # Заполнить при первом open в Xcode
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    # ATS bypass выключен: bridge ходит через Cloudflare Tunnel → настоящий TLS,
    # ATS доволен. Раскомментируй ТОЛЬКО для self-signed TLS внутри Tailscale/LAN
    # (несовместимо с App Store review).
    # INFOPLIST_KEY_NSAppTransportSecurity: "{NSAllowsArbitraryLoads = YES;}"

targets:
  ACPChat:
    type: application
    platform: iOS
    sources:
      - path: ACPChat
        excludes:
          - "Utils/**"
          - "ViewModels/**"
    info:
      path: ACPChat/Info.plist
      properties:
        CFBundleDisplayName: ACPChat
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vrt.acpchat
        TARGETED_DEVICE_FAMILY: "1,2"    # iPhone + iPad
